name: build-windows

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install wxPython pyautogui pyinstaller

      - run: >
          pyinstaller --onefile --windowed
          --name Clicker clicker.py

      - uses: actions/upload-artifact@v4
        with:
          name: Clicker
          path: dist/Clicker.exe
